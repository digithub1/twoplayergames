<!DOCTYPE html>
<html lang="en-us">
<head>
<script>
window.adsbygoogle = window.adsbygoogle || [];
window.adBreak = window.adConfig = function(o) { if(o && typeof o.beforeAd === 'function') try{o.beforeAd();}catch(e){} if(o && typeof o.adBreakDone === 'function') try{o.adBreakDone();}catch(e){} if(o && typeof o.onReady === 'function') try{o.onReady();}catch(e){} };

    <meta charset="utf-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>Tag Run</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
        }
    </style>
    <link href="TemplateData/favicon.ico" rel="shortcut icon">
    <link href="TemplateData/style.css" rel="stylesheet">
</head>
<body class="dark">
<div class="unity-desktop" id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>
<div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
            <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
    </div>
</div>
<script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/TPG-TagRun-V01e.loader.js";
    const config = {
        dataUrl: buildUrl + "/TPG-TagRun-V01e.data.unityweb",
        frameworkUrl: buildUrl + "/TPG-TagRun-V01e.framework.js.unityweb",
        codeUrl: buildUrl + "/TPG-TagRun-V01e.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cursora Labs OÜ",
        productName: "Tag Run",
        productVersion: "0.1",
        devicePixelRatio: 1,
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    const canFullscreen = (function () {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
        ]) {
            if (key in document) {
                return true;
            }
        }
        return false;
    }());

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
    }

    loadingCover.style.display = "";

    // Explicitly setting the background image using JavaScript
    document.body.style.backgroundImage = "url('Build.jpg')";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundSize = "cover";

    var myGameInstance = null;

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
            spinner.style.display = "none";
            progressBarEmpty.style.display = "";
            progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
            myGameInstance = unityInstance;
            loadingCover.style.display = "none";
            // Now that Unity is fully loaded, it's safe to interact with it
            //checkDevice(); // Ensure this function is called here
        }).catch((message) => {
            alert(message);
        });
    };

    document.body.appendChild(script);
</script>


</body>
</html>
