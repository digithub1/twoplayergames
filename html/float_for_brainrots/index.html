<!DOCTYPE html>
<html lang="en-us">

<head>
<script>
window.adsbygoogle = window.adsbygoogle || [];
window.adBreak = window.adConfig = function(o) { if(o && typeof o.beforeAd === 'function') try{o.beforeAd();}catch(e){} if(o && typeof o.adBreakDone === 'function') try{o.adBreakDone();}catch(e){} if(o && typeof o.onReady === 'function') try{o.onReady();}catch(e){} };
window.initSdk = window.InitSDKJs = function() { return Promise.resolve(true); };
window.loadRewarded = function() {};
window.showRewarded = function(cb) { if(typeof cb === 'function') cb(true); };

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Float For Brainrots</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        html,
        body {
            background-image: url("Build/Build.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            background-color: #000;
            font-family: 'Poppins', sans-serif;
        }

        div#gameContainer {
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        div#gameContainer canvas {
            position: absolute;
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        div#gameContainer canvas[data-pixel-art="true"] {
            position: absolute;
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .loading-stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(20px, 3.5vh, 36px);
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.6s ease-out;
            padding: 24px;
            box-sizing: border-box;
        }

        .loading-logo {
            width: clamp(160px, 24vw, 280px);
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.55))
                    drop-shadow(0 0 40px rgba(120, 200, 255, 0.18));
            animation: loadingFloat 4s ease-in-out infinite;
        }

        .loading-track {
            width: clamp(200px, 26vw, 320px);
            height: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.14);
            overflow: hidden;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08),
                        inset 0 1px 3px rgba(0, 0, 0, 0.55);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg,
                        #00d4ff 0%, #7a5cff 50%, #ff4ecb 100%);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.55),
                        0 0 24px rgba(255, 78, 203, 0.28);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent,
                        rgba(255, 255, 255, 0.55), transparent);
            animation: loadingShimmer 1.8s ease-in-out infinite;
            border-radius: inherit;
        }

        .loading-label {
            font-family: 'Poppins', system-ui, sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
            margin: 0;
        }

        .loading-stage.is-hidden {
            opacity: 0;
        }

        @keyframes loadingFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @keyframes loadingShimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(90deg, rgba(14, 176, 240, 1) 0%, rgba(87, 199, 133, 1) 97%);
            color: white;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            font-weight: 600;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: orientationPulse 2s ease-in-out infinite;
            max-width: 90vw;
            max-height: 90vh;
            min-width: 300px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        #orientation-warning.show {
            display: flex;
        }

        @keyframes orientationPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
        }

        @keyframes rotateImage {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        #orientation-image {
            width: 80px;
            height: 80px;
            display: block;
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            animation: rotateImage 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .orientation-text {
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
            flex-shrink: 0;
        }

        /* RTL support for Arabic */
        .orientation-text[dir="rtl"] {
            direction: rtl;
            text-align: center;
        }

        /* Mobile responsive adjustments */
        @media (max-width: 480px) {
            #orientation-warning {
                padding: 30px 25px;
                font-size: 16px;
                min-width: 280px;
                gap: 15px;
            }
            
            #orientation-image {
                width: 60px;
                height: 60px;
            }
            
            .orientation-text {
                font-size: 14px;
            }
        }

        @media (max-height: 500px) {
            #orientation-warning {
                padding: 20px 30px;
                gap: 10px;
            }
            
            #orientation-image {
                width: 50px;
                height: 50px;
            }
            
            .orientation-text {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div id="orientation-warning">
        <img id="orientation-image" src="TemplateData/Orientation/orientation.png" alt="Orientation">
        <div class="orientation-text">Please rotate your device to the correct mode.</div>
    </div>
    <div id="gameContainer">
        <div class="loading-stage" id="loading-panel">
            <img src="TemplateData/logo.png" class="loading-logo" alt="">
            <div class="loading-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="loading-label" id="loading-percent">LOADING 0%</span>
        </div>
        <canvas id="unity-canvas"
                width="960" height="600"
                data-pixel-art=""></canvas>
        <script src="Build/FloattoBrainrots_V17.loader.js"></script>
        <script>
            // Multi-language support for orientation messages
            var orientationMessages = {
                'tr': {
                    portrait: 'Lütfen cihazınızı dikey konuma çevirin.',
                    landscape: 'Lütfen cihazınızı yatay konuma çevirin.'
                },
                'en': {
                    portrait: 'Please rotate your device to portrait mode.',
                    landscape: 'Please rotate your device to landscape mode.'
                },
                'ar': {
                    portrait: 'يرجى تدوير جهازك إلى الوضع الرأسي.',
                    landscape: 'يرجى تدوير جهازك إلى الوضع الأفقي.'
                },
                'de': {
                    portrait: 'Bitte drehen Sie Ihr Gerät in den Hochformat-Modus.',
                    landscape: 'Bitte drehen Sie Ihr Gerät in den Querformat-Modus.'
                },
                'pt': {
                    portrait: 'Por favor, gire seu dispositivo para o modo retrato.',
                    landscape: 'Por favor, gire seu dispositivo para o modo paisagem.'
                },
                'ru': {
                    portrait: 'Пожалуйста, поверните устройство в портретный режим.',
                    landscape: 'Пожалуйста, поверните устройство в альбомный режим.'
                },
                'es': {
                    portrait: 'Por favor, gira tu dispositivo al modo vertical.',
                    landscape: 'Por favor, gira tu dispositivo al modo horizontal.'
                },
                'fr': {
                    portrait: 'Veuillez faire pivoter votre appareil en mode portrait.',
                    landscape: 'Veuillez faire pivoter votre appareil en mode paysage.'
                }
            };

            // Get browser language
            function getBrowserLanguage() {
                var lang = navigator.language || navigator.userLanguage;
                var langCode = lang.substring(0, 2).toLowerCase();
                
                // Check if language is supported, default to English
                return orientationMessages[langCode] ? langCode : 'en';
            }

            // Get localized message
            function getOrientationMessage(requiredOrientation, isCurrentlyPortrait) {
                var lang = getBrowserLanguage();
                var messages = orientationMessages[lang];
                var normalizedRequired = requiredOrientation.toLowerCase();
                
                if (normalizedRequired === "portrait" && !isCurrentlyPortrait) {
                    // Need to rotate to Portrait
                    return messages.portrait;
                } else if (normalizedRequired === "landscape" && isCurrentlyPortrait) {
                    // Need to rotate to Landscape
                    return messages.landscape;
                }
                return '';
            }

            var canvas = document.querySelector("#unity-canvas");
            var progressBar = document.querySelector("#progress-bar");
            var gameContainer = document.querySelector("#gameContainer");
            var orientationWarning = document.querySelector("#orientation-warning");
            var config = {
                dataUrl: "Build/FloattoBrainrots_V17.data.unityweb",
                frameworkUrl: "Build/FloattoBrainrots_V17.framework.js.unityweb",
                codeUrl: "Build/FloattoBrainrots_V17.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "gameVgames",
                productName: "Float For Brainrots",
                productVersion: "1.0.0",
                matchWebGLToCanvasSize: false,
            };
            var scaleToFit;
            try {
                scaleToFit = !!JSON.parse("");
            } catch (e) {
                scaleToFit = true;
            }

            function progressHandler(progress) {
                var percent = Math.round(progress * 100);
                var bar = document.querySelector("#progress-bar");
                var label = document.querySelector("#loading-percent");
                var panel = document.querySelector("#loading-panel");

                if (bar) bar.style.width = percent + '%';
                if (label) label.textContent = 'LOADING ' + percent + '%';

                if (progress >= 1) {
                    setTimeout(function () {
                        if (panel) panel.classList.add('is-hidden');
                    }, 400);
                    setTimeout(function () {
                        if (panel) panel.style.display = 'none';
                    }, 1100);
                }
            }

            function onResize() {
                var container = canvas.parentElement;
                container.style.width  = window.innerWidth  + "px";
                container.style.height = window.innerHeight + "px";
                container.style.top    = "0px";
                container.style.left   = "0px";
            }

           function checkOrientation(requiredOrientation) {
                if (!requiredOrientation) {
                    console.log('No required orientation specified, hiding warning');
                    orientationWarning.classList.remove('show');
                    gameContainer.style.display = 'block';
                    return;
                }
                
                var orientationText = document.querySelector('.orientation-text');
                var isCurrentlyPortrait = window.innerHeight > window.innerWidth;
                var currentLang = getBrowserLanguage();
                
                // Normalize orientation string (case insensitive)
                var normalizedRequired = requiredOrientation.toLowerCase();
                
                // Debug info
                console.log('=== Orientation Check ===');
                console.log('Required Orientation:', requiredOrientation, '(normalized:', normalizedRequired + ')');
                console.log('Window dimensions:', window.innerWidth, 'x', window.innerHeight);
                console.log('Is currently portrait:', isCurrentlyPortrait);
                
                var needsWarning = false;
                
                // Check if device orientation matches required orientation
                if (normalizedRequired === "portrait" && !isCurrentlyPortrait) {
                    // Game requires Portrait but device is in Landscape
                    needsWarning = true;
                    console.log('✗ Warning: Game needs Portrait, device is Landscape');
                } else if (normalizedRequired === "landscape" && isCurrentlyPortrait) {
                    // Game requires Landscape but device is in Portrait  
                    needsWarning = true;
                    console.log('✗ Warning: Game needs Landscape, device is Portrait');
                } else {
                    console.log('✓ Orientation is correct, no warning needed');
                }
                
                console.log('Show warning:', needsWarning);
                console.log('========================');
                
                if (needsWarning) {
                    orientationWarning.classList.add('show');
                    gameContainer.style.display = 'none';
                    if (orientationText) {
                        orientationText.textContent = getOrientationMessage(requiredOrientation, isCurrentlyPortrait);
                        // Set RTL for Arabic
                        if (currentLang === 'ar') {
                            orientationText.setAttribute('dir', 'rtl');
                        } else {
                            orientationText.removeAttribute('dir');
                        }
                    }
                } else {
                    // Orientation is correct, hide warning
                    orientationWarning.classList.remove('show');
                    gameContainer.style.display = 'block';
                }
            }

            // Global variable to store current orientation setting
            var currentOrientationSetting = null;

            function loadTemplateConfig() {
                var request = new XMLHttpRequest();
                request.open('GET', 'TemplateData/Orientation/template.json', true);
                request.onreadystatechange = function() {
                    if (request.readyState === 4) {
                        if (request.status === 200) {
                            try {
                                var config = JSON.parse(request.responseText);
                                console.log('Template config loaded:', config);
                                var orientationOption = config.customOptions.find(option => option.name === "orientation");
                                if (orientationOption) {
                                    currentOrientationSetting = orientationOption.default;
                                    console.log('Orientation setting from template:', currentOrientationSetting);
                                    checkOrientation(currentOrientationSetting);
                                } else {
                                    console.log('No orientation option found in template');
                                }
                            } catch (e) {
                                console.error('Error parsing template.json:', e);
                            }
                        } else {
                            console.error('Failed to load template.json:', request.status);
                            // Fallback: hide orientation warning if template fails to load
                            orientationWarning.classList.remove('show');
                            gameContainer.style.display = 'block';
                        }
                    }
                };
                request.send();
            }

            var lastIsPortrait = null;
            var resizeRaf = null;
            var bufferResizeTimer = null;

            function updateDrawingBuffer() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var cw = canvas.clientWidth  || window.innerWidth;
                var ch = canvas.clientHeight || window.innerHeight;
                var w = Math.max(1, Math.round(cw * dpr));
                var h = Math.max(1, Math.round(ch * dpr));
                if (canvas.width  !== w) canvas.width  = w;
                if (canvas.height !== h) canvas.height = h;
            }

            function handleResize() {
                resizeRaf = null;
                onResize();

                if (bufferResizeTimer) clearTimeout(bufferResizeTimer);
                bufferResizeTimer = setTimeout(function () {
                    bufferResizeTimer = null;
                    updateDrawingBuffer();
                }, 200);

                if (currentOrientationSetting) {
                    var isPortrait = window.innerHeight > window.innerWidth;
                    if (isPortrait !== lastIsPortrait) {
                        lastIsPortrait = isPortrait;
                        checkOrientation(currentOrientationSetting);
                    }
                }
            }

            function scheduleResize() {
                if (resizeRaf === null) {
                    resizeRaf = requestAnimationFrame(handleResize);
                }
            }

            updateDrawingBuffer();

            createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                canvas = instance.Module.canvas;
                myGameInstance = instance;
                onResize();
                updateDrawingBuffer();
            });

            window.addEventListener('resize', scheduleResize);

            window.addEventListener('orientationchange', function () {
                setTimeout(function () {
                    lastIsPortrait = null;
                    scheduleResize();
                }, 100);
            });

            loadTemplateConfig();
        </script>

        <!--RHM API-->
		
    </div>
</body>

</html>
