    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Italian Brainrot Obby Parkour</title>
    <script>
      window.pgAdsCallbacks = window.pgAdsCallbacks || [];
    </script>
    
    <style>
		html,
		body {
			width: 100%;
			height: 100%;
			overflow: visible;
			padding: 0;
			margin: 0;
		}
	</style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">	
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      const hideFullScreenButton = "";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/TwoPlayGama_ItalianBrainrotObbyParkour_V01m-1.loader.js";
      const config = {
        dataUrl: buildUrl + "/TwoPlayGama_ItalianBrainrotObbyParkour_V01m-1.data.unityweb",
        frameworkUrl: buildUrl + "/TwoPlayGama_ItalianBrainrotObbyParkour_V01m-1.framework.js.unityweb",
        codeUrl: buildUrl + "/TwoPlayGama_ItalianBrainrotObbyParkour_V01m-1.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cursora Labs O.Ü",
        productName: "Italian Brainrot Obby Parkour",
        productVersion: "0.1m",
        webglContextAttributes: {
    		preserveDrawingBuffer: true,
		powerPreference: "high-performance",
  	},
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1.5;
        } else {
            config.devicePixelRatio = 1;
        }
      
        // The background image when loading the game. When building a build, the code changes depending on the project settings.
        var backgroundUnity = "url('" + buildUrl + "/TwoPlayGama_ItalianBrainrotObbyParkour_V01m.jpg') center / cover";
        loadingCover.style.background = "url('./Build.png') center / cover";
        loadingCover.style.display = "";

	    var myGameInstance = null;
	  
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingCover.style.display = "none";

                const sendToUnity = (method, arg = "") => {
                    if (myGameInstance && myGameInstance.SendMessage) {
                        myGameInstance.SendMessage("WebGLLifecycleBridge", method, String(arg));
                    }
                };

                const resumeWebAudioIfNeeded = () => {
                    try {
                        const ctx =
                            myGameInstance?.Module?.webAudioContext ||
                            myGameInstance?.audioContext ||
                            window.AudioContext?.prototype;
                        if (ctx && ctx.state && ctx.state !== "running" && ctx.resume) {
                            ctx.resume();
                        }
                    } catch (e) {}
                };

                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "hidden") {
                        sendToUnity("OnPageHidden");
                    } else {
                        sendToUnity("OnPageVisible");
                        resumeWebAudioIfNeeded();
                    }
                });

                window.addEventListener("blur", () => sendToUnity("OnPageHidden"));
                window.addEventListener("focus", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });

                window.addEventListener("pagehide", () => sendToUnity("OnPageHidden"));
                window.addEventListener("pageshow", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });

                window.addEventListener("freeze", () => sendToUnity("OnPageHidden"));
                window.addEventListener("resume", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });
            }).catch((message) => {
                alert(message);
            });
        };
	  
      document.body.appendChild(script);
    </script>
</body>
</html>
