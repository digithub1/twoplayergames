                // UnityLoader Mock & Auto-Fix
                if (typeof UnityLoader === 'undefined') {
                    window._UnityLoaderMock = true;
                    window.UnityLoader = {
                        instantiate: function(container, url, options) {
                            if (!window._UnityLoaderMock) return; // Prevent re-entry if already fixed
                            
                            console.warn("[System] UnityLoader.js is missing locally. Attempting CDN fallback...");
                            const cdnScript = document.createElement('script');
                            
                            // Clear the mock so the real script can define it
                            window.UnityLoader = undefined;
                            try { delete window.UnityLoader; } catch(e) {}

                            let fallbackUrl = 'https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.js';
                            if (url.includes('2.7.json')) fallbackUrl = 'https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.js';
                            else if (url.includes('UnityLoader')) fallbackUrl = 'https://cdn.jsdelivr.net/gh/n-101-1/1@main/UnityLoader.js';
                            
                            cdnScript.src = fallbackUrl;
                            cdnScript.onload = () => {
                                console.log("[System] CDN Fallback loaded. Re-triggering instantiate...");
                                delete window._UnityLoaderMock;
                                // The real script should have defined UnityLoader
                                if (typeof UnityLoader !== 'undefined') {
                                    UnityLoader.instantiate(container, url, options);
                                } else {
                                    console.error("[Error] CDN Fallback failed to define UnityLoader correctly.");
                                }
                            };
                            cdnScript.onerror = () => {
                                console.error("[Critical Error] UnityLoader.js missing and CDN fallback failed.");
                            };
                            document.head.appendChild(cdnScript);
                            return { SendMessage: function() {} };
                        }
                    };
                }
